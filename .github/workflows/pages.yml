name: Deploy Pages

# 把 docs/ 发布为 GitHub Pages（落地页 + 截图 + 演示视频）。
# 五个镜像共用同一份 docs/：页面脚本按当前域名改写仓库/下载/Issue 链接，
# 因此不需要为每个账号单独维护一套页面。
on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 落地页引用的每一张图、每一段视频都必须真实存在。
      # 上一版曾引用 screenshots/05-projects.png 这类从未生成的文件，
      # 线上页面因此有 4 张破图，而没有任何检查会发现。
      - name: Verify assets referenced by the landing page exist
        run: |
          missing=0
          for f in $(grep -oE '(src|poster)="[^"]+"' docs/index.html | cut -d'"' -f2 | grep -vE '^(https?:|#|data:)'); do
            if [ ! -f "docs/$f" ]; then echo "::error file=docs/index.html::missing asset docs/$f"; missing=1; fi
          done
          for f in $(grep -oE 'href="[^"]+\.(md|png|mp4)"' docs/index.html | cut -d'"' -f2 | grep -vE '^(https?:|#)'); do
            if [ ! -f "docs/$f" ]; then echo "::error file=docs/index.html::missing link docs/$f"; missing=1; fi
          done
          test "$missing" = "0" || exit 1
          echo "all referenced assets exist"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
