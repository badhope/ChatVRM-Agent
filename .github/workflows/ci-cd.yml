name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-coverage

      - name: Smoke-test the live backend
        if: matrix.node-version == '22.x'
        env:
          PORT: '3500'
        run: |
          set -e
          node dist/cli/index.js --help || true
          (PORT=3500 npm run server &)
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -fsS http://localhost:3500/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for path in \
            /api/health \
            /api/config/providers \
            /api/config/snapshot \
            /api/chat/sessions \
            /api/graph \
            /api/dashboard \
            /api/tools \
            /api/emotion \
            /api/personality \
            /api/memory \
            '/api/memory?q=test' \
          ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3500$path")
            echo "$path => $code"
            if [ "$code" != "200" ]; then
              echo "FAIL: $path returned $code"
              pkill -f "tsx.*server" || true
              exit 1
            fi
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3500/")
          echo "/ => $code (frontend SPA)"
          if [ "$code" != "200" ]; then
            echo "FAIL: root returned $code"
            pkill -f "tsx.*server" || true
            exit 1
          fi
          pkill -f "tsx.*server" || true

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public

  docs:
    name: Generate Documentation
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate API docs
        run: npm run docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api
          destination_dir: api
