name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 本项目只在 Windows 上开发与打包：Tauri 的构建脚本在 Linux 需要 webkit2gtk 系统依赖，
# 用 windows-latest 既贴合真实目标平台，也免去装一堆图形库。
jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: 代码风格检查
        run: npm run format:check
      - name: 静态检查（ESLint）
        run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    name: 后端测试与静态检查
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test（含 IPC 契约导出）
        run: cargo test
      - name: 契约漂移门禁（Rust 改了结构体却没重新生成 TS）
        run: |
          # 用 --name-only / ls-files 判空，不依赖原生命令退出码，避免 pwsh 下误抛。
          # 内容比对按 .gitattributes 归一化换行符，不会被 CRLF 或 stat 缓存误报。
          $changed = git diff --name-only -- :/src/generated
          $untracked = git ls-files --others --exclude-standard -- :/src/generated
          if ($changed -or $untracked) {
            Write-Error "src/generated 与 Rust 结构体不一致，请本地跑 cargo test 后提交生成物：`n$changed`n$untracked"
            exit 1
          }
      - name: cargo clippy（零警告门禁）
        run: cargo clippy --all-targets -- -D warnings

  package:
    name: 构建校验（产出 exe，不打包安装器）
    runs-on: windows-latest
    needs: [frontend, backend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: 校验可执行文件确实产出
        run: |
          $exe = 'src-tauri/target/release/workbench.exe'
          if (-not (Test-Path $exe)) { Write-Error "未产出 $exe"; exit 1 }
          Get-Item $exe | Select-Object FullName, Length, LastWriteTime
