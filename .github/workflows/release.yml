name: Release

# 打 v* tag 时构建三平台产物并发布 Release；手动触发只构建、不发布。
# 未签名产物不会自动更新，也不伪装成已签名：Release 正文明确写清楚。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: workbench-windows-x64
          - os: ubuntu-latest
            bundle: deb
            artifact: workbench-linux-amd64
          - os: macos-latest
            bundle: app
            artifact: workbench-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf libssl-dev pkg-config

      - run: npm ci

      - name: Build bundle
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe \
                   src-tauri/target/release/bundle/deb/*.deb; do
            cp "$f" release-assets/
          done
          if [ -d src-tauri/target/release/bundle/macos ]; then
            for d in src-tauri/target/release/bundle/macos/*.app; do
              (cd src-tauri/target/release/bundle/macos && zip -qry "$OLDPWD/release-assets/$(basename "$d" .app).zip" "$(basename "$d")")
            done
          fi
          ls -la release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | Windows 10/11 x64 | `Workbench_<version>_x64-setup.exe` (NSIS) |
            | Linux x64 | `workbench_<version>_amd64.deb` |
            | macOS | `Workbench.zip` (unsigned `.app`) |

            These builds are **not code-signed**. Windows SmartScreen may ask for
            "More info → Run anyway"; on macOS right-click the app and choose Open
            the first time. Verify downloads against `SHA256SUMS.txt`.
