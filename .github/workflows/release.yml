name: Release

# 打 tag（v*）时自动构建 Windows 安装包并发布 Release。
# 手动触发（workflow_dispatch）只构建、不发布，便于验证流水线。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: 构建（产出 NSIS 安装包与独立 exe）
        run: npm run tauri build

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $exe = 'src-tauri/target/release/workbench.exe'
          if (-not (Test-Path $exe)) { Write-Error "未产出 $exe"; exit 1 }
          Copy-Item $exe release-assets/
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe'
          if (-not $setup) { Write-Error '未产出 NSIS 安装包'; exit 1 }
          Copy-Item $setup.FullName 'release-assets/Workbench_0.1.0_x64-setup.exe'
          Get-ChildItem release-assets | Select-Object Name, Length

      # 便于在不看 Release 的情况下直接下载构建产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: workbench-windows-x64
          path: release-assets/*
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          generate_release_notes: true
          body: |
            ## 下载

            | 文件 | 说明 |
            |------|------|
            | `Workbench_0.1.0_x64-setup.exe` | **推荐**：NSIS 安装包，双击安装 |
            | `workbench.exe` | 免安装单文件，直接运行 |

            仅 Windows x64。安装包未做代码签名，Windows 可能提示「未知发布者」，
            选择「更多信息 → 仍要运行」即可。

            完整改动见 [CHANGELOG.md](https://github.com/X33834/workbench/blob/main/CHANGELOG.md)。
