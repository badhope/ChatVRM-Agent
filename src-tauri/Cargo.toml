[package]
name = "workbench"
version = "0.1.0"
description = "工作台 - 桌面优先的本机工作管理台"
edition = "2021"
rust-version = "1.77"

[lib]
name = "workbench_lib"
path = "src/lib.rs"

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
reqwest = { version = "0.12", features = ["blocking", "json"] }
log = "0.4"
fern = "0.7"
chrono = "0.4"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[dependencies.tauri]
version = "2"
features = ["tray-icon"]

[dependencies.tauri-plugin-opener]
version = "2"

[dependencies.tauri-plugin-notification]
version = "2"

[dependencies.tauri-plugin-global-shortcut]
version = "2"

[dependencies.tauri-plugin-window-state]
version = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
