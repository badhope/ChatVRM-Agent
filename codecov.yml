codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
  coverage:
    status:
      project:
        default:
          target: 80%
          threshold: 5%
        unit:
          paths:
            - "src/**/*.ts"
          target: 80%
      patch:
        default:
          target: 70%
  comment:
    layout: "reach, diff, flags, files"
    behavior: default
